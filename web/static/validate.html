<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TradingBot Validate</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
<style>
  .key-hint { font-family: monospace; padding: 1px 6px; border-radius: 4px; background: #334155; }
</style>
</head>
<body class="bg-slate-900 text-slate-100">

<div x-data="validator()" x-init="boot()"
     @keydown.window.y="if (!isInputFocused($event)) validate('yes')"
     @keydown.window.n="if (!isInputFocused($event)) validate('no')"
     @keydown.window.s="if (!isInputFocused($event)) validate('skip')"
     @keydown.window.e="if (!isInputFocused($event)) saveEdited()"
     class="flex flex-col h-screen overflow-hidden">

  <!-- Header avec stats -->
  <header class="bg-slate-950 border-b border-slate-800 p-3 flex items-center gap-4 text-xs flex-wrap">
    <a href="/labeling" class="text-slate-500 hover:text-slate-300">← Labeling</a>
    <span class="text-xl font-bold">⚡ Validation rapide</span>

    <div class="ml-4 flex items-center gap-3">
      <span><span class="text-slate-500">Total:</span> <span class="font-mono text-lg" x-text="stats.total"></span></span>
      <span class="text-emerald-400">✓ <span x-text="stats.yes"></span></span>
      <span class="text-rose-400">✗ <span x-text="stats.no"></span></span>
      <span class="text-amber-400">✎ <span x-text="stats.edited || 0"></span></span>
      <span class="text-slate-500">~ <span x-text="stats.skip"></span></span>
    </div>

    <div class="ml-4 flex items-center gap-3 border-l border-slate-700 pl-4">
      <span>YES winrate: <span class="font-mono text-emerald-400" x-text="stats.yes_winrate + '%'"></span></span>
      <span>Expectancy: <span class="font-mono" :class="stats.yes_expectancy_r >= 0 ? 'text-emerald-400' : 'text-rose-400'"
        x-text="(stats.yes_expectancy_r >= 0 ? '+' : '') + stats.yes_expectancy_r + 'R'"></span></span>
    </div>

    <!-- Progression generation -->
    <div class="ml-4 flex items-center gap-2 px-3 py-1 bg-slate-900 rounded">
      <span class="text-slate-400">Gen <span class="font-bold text-purple-400" x-text="genStatus.current_generation || 1"></span></span>
      <div class="w-32 h-2 bg-slate-700 rounded overflow-hidden">
        <div class="h-full bg-purple-500 transition-all"
          :style="`width: ${Math.min(100, (genStatus.validations_in_current_gen || 0) / 30 * 100)}%`"></div>
      </div>
      <span class="text-slate-400 font-mono">
        <span x-text="genStatus.validations_in_current_gen || 0"></span>/30
      </span>
    </div>

    <button x-show="(genStatus.validations_in_current_gen || 0) >= 30"
      @click="retrain()"
      class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded font-bold text-xs animate-pulse">
      🚀 RETRAIN (Gen <span x-text="(genStatus.current_generation || 1) + 1"></span>)
    </button>

    <div class="ml-auto flex items-center gap-2">
      <label class="flex items-center gap-1 text-xs">
        <input type="checkbox" x-model="revealed" @change="redraw()">
        <span>Reveal future</span>
      </label>
      <select x-model="filterInstrument" @change="next()"
        class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs">
        <option value="">Tous actifs</option>
        <template x-for="inst in instruments" :key="inst">
          <option :value="inst" x-text="inst"></option>
        </template>
      </select>
      <a href="/api/validate/stats" target="_blank"
        class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs">📊</a>
      <a href="/api/validate/generation-status" target="_blank"
        class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded text-xs">🌳 Gen</a>
    </div>
  </header>

  <!-- Trade info / editor -->
  <div class="bg-slate-900 border-b border-slate-800 p-3 flex items-center gap-3 text-xs flex-wrap">
    <div class="text-lg font-bold" x-text="current?.instrument || '...'"></div>
    <div class="text-slate-400" x-text="current?.day"></div>
    <div class="text-slate-400" x-text="current?.entry_time?.slice(11, 16) + ' UTC'"></div>

    <!-- Direction toggle -->
    <button @click="edited.direction = 'bullish'; isEdited = true; redraw()"
      class="px-3 py-1 rounded border-2"
      :class="edited.direction === 'bullish' ? 'bg-emerald-700 border-emerald-500' : 'border-emerald-900'">
      ▲ LONG
    </button>
    <button @click="edited.direction = 'bearish'; isEdited = true; redraw()"
      class="px-3 py-1 rounded border-2"
      :class="edited.direction === 'bearish' ? 'bg-rose-700 border-rose-500' : 'border-rose-900'">
      ▼ SHORT
    </button>

    <!-- Inputs editables -->
    <span class="text-slate-500 ml-3">Entry:</span>
    <input type="number" step="0.01" x-model.number="edited.entry_price" @change="onEdit()"
      class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono">

    <span class="text-rose-400">SL:</span>
    <input type="number" step="0.01" x-model.number="edited.stop_loss" @change="onEdit()"
      class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono">

    <span class="text-emerald-400">TP:</span>
    <input type="number" step="0.01" x-model.number="edited.take_profit" @change="onEdit()"
      class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono">
    <span x-show="current?.tp_source" class="text-[10px] text-emerald-400" :title="current?.tp_source"
      x-text="'→ ' + current?.tp_source"></span>

    <span class="text-amber-500">OB high:</span>
    <input type="number" step="0.01" x-model.number="edited.ob_zone.high" @change="onEdit()"
      class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono">
    <span class="text-amber-500">OB low:</span>
    <input type="number" step="0.01" x-model.number="edited.ob_zone.low" @change="onEdit()"
      class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono">

    <span class="text-slate-500 ml-2">RR:</span>
    <span class="font-mono font-bold" x-text="computedRR()?.toFixed(2) || '-'"></span>

    <span x-show="isEdited" class="px-2 py-0.5 rounded bg-amber-900 text-amber-300 text-xs">✎ MODIFIE</span>

    <!-- Indicateurs confluence ICT -->
    <span x-show="current?.smt?.confirmed" class="ml-3 px-2 py-1 rounded text-xs font-bold bg-purple-900 text-purple-200" title="SMT divergence confirmee">
      ⚡ SMT
    </span>
    <span x-show="current?.fvg_m15" class="ml-1 px-2 py-1 rounded text-xs font-bold bg-cyan-900 text-cyan-200" title="FVG M15 en confluence">
      💎 FVG M15
    </span>

    <!-- Score HTF avec breakdown au survol -->
    <div class="ml-2 relative group" x-show="current?.htf_alignment">
      <span class="px-3 py-1 rounded text-xs font-bold cursor-help"
        :class="{
          'bg-emerald-700 text-emerald-100': current?.htf_alignment?.verdict === 'premium',
          'bg-emerald-900 text-emerald-200': current?.htf_alignment?.verdict === 'good',
          'bg-amber-900 text-amber-200':    current?.htf_alignment?.verdict === 'mediocre',
          'bg-rose-900 text-rose-200':      current?.htf_alignment?.verdict === 'weak',
        }"
        x-text="'HTF ' + current?.htf_alignment?.total_score + '/100'"></span>
      <!-- Tooltip breakdown -->
      <div class="hidden group-hover:block absolute z-50 top-full mt-1 left-0 bg-slate-950 border border-slate-700 rounded p-3 w-80 shadow-2xl">
        <div class="text-xs font-bold mb-2 text-slate-300">Alignement HTF</div>
        <template x-for="c in current?.htf_alignment?.components || []" :key="c.name">
          <div class="flex items-start justify-between py-1 border-t border-slate-800 text-[11px]">
            <div class="flex-1">
              <span :class="{
                'text-emerald-400': c.status === 'ok',
                'text-amber-400':   c.status === 'warning',
                'text-rose-400':    c.status === 'fail',
                'text-slate-500':   c.status === 'n/a',
              }" x-text="c.name"></span>
              <div class="text-[10px] text-slate-500" x-text="c.detail"></div>
            </div>
            <span class="font-mono ml-2"
              :class="c.score === c.max ? 'text-emerald-400' : (c.score > 0 ? 'text-amber-400' : 'text-rose-400')"
              x-text="c.score + '/' + c.max"></span>
          </div>
        </template>
      </div>
    </div>

    <span class="ml-auto px-3 py-1 rounded text-xs font-bold"
      :class="{
        'bg-emerald-900 text-emerald-300': current?.outcome === 'win',
        'bg-rose-900 text-rose-300': current?.outcome === 'loss',
        'bg-slate-700 text-slate-300': !['win','loss'].includes(current?.outcome),
      }"
      x-text="'Outcome bot: ' + (current?.outcome?.toUpperCase() || 'PENDING')"></span>
  </div>

  <!-- Toolbar dessin chart -->
  <div class="bg-slate-900 border-b border-slate-800 p-2 flex items-center gap-2 text-xs">
    <span class="text-slate-500 uppercase">Click chart pour ajuster :</span>
    <button @click="currentTool = 'entry'"
      class="px-3 py-1 rounded border"
      :class="currentTool === 'entry' ? 'bg-blue-700 border-blue-500' : 'border-blue-900'">
      📏 Entry
    </button>
    <button @click="currentTool = 'sl'"
      class="px-3 py-1 rounded border"
      :class="currentTool === 'sl' ? 'bg-rose-700 border-rose-500' : 'border-rose-900'">
      🔴 SL
    </button>
    <button @click="currentTool = 'tp'"
      class="px-3 py-1 rounded border"
      :class="currentTool === 'tp' ? 'bg-emerald-700 border-emerald-500' : 'border-emerald-900'">
      🟢 TP
    </button>
    <button @click="currentTool = 'ob_high'"
      class="px-3 py-1 rounded border"
      :class="currentTool === 'ob_high' ? 'bg-amber-700 border-amber-500' : 'border-amber-900'">
      🟧 OB haut
    </button>
    <button @click="currentTool = 'ob_low'"
      class="px-3 py-1 rounded border"
      :class="currentTool === 'ob_low' ? 'bg-amber-800 border-amber-600' : 'border-amber-900'">
      🟧 OB bas
    </button>
    <button @click="currentTool = 'none'" class="px-3 py-1 rounded border border-slate-700">✋</button>
    <button @click="resetToOriginal()" class="ml-auto px-3 py-1 rounded border border-slate-700 hover:bg-slate-800">
      ↺ Reset au bot
    </button>
  </div>

  <!-- Chart -->
  <div class="flex-1 relative bg-slate-950">
    <div id="chart" class="absolute inset-0"></div>
    <div x-show="loading" class="absolute inset-0 flex items-center justify-center bg-slate-900 bg-opacity-50">
      <div class="text-slate-400">Chargement...</div>
    </div>
  </div>

  <!-- Boutons décision + commentaire -->
  <footer class="bg-slate-950 border-t border-slate-800 p-3 flex items-center justify-center gap-3">
    <input type="text" x-model="comment"
      placeholder="Commentaire optionnel : pourquoi oui/non, ce qui cloche, etc."
      class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-3 text-sm">

    <button @click="validate('no')"
      class="px-8 py-3 bg-rose-700 hover:bg-rose-600 rounded-lg font-bold text-lg"
      :disabled="saving">
      ✗ NON
      <div class="text-[10px] opacity-60">N</div>
    </button>

    <button @click="validate('skip')"
      class="px-5 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm"
      :disabled="saving">
      ~ <span class="text-[10px] opacity-60">S</span>
    </button>

    <button @click="saveEdited()"
      x-show="isEdited"
      class="px-8 py-3 bg-amber-700 hover:bg-amber-600 rounded-lg font-bold text-lg"
      :disabled="saving">
      ✎ MODIF
      <div class="text-[10px] opacity-60">E</div>
    </button>

    <button @click="validate('yes')"
      x-show="!isEdited"
      class="px-8 py-3 bg-emerald-700 hover:bg-emerald-600 rounded-lg font-bold text-lg"
      :disabled="saving">
      ✓ OUI
      <div class="text-[10px] opacity-60">Y</div>
    </button>
  </footer>
  <div class="bg-slate-950 text-center text-[10px] text-slate-500 py-1">
    <span class="key-hint">Y</span> oui &nbsp;
    <span class="key-hint">N</span> non &nbsp;
    <span class="key-hint">E</span> modifie &nbsp;
    <span class="key-hint">S</span> skip &nbsp;
    | Modifie via inputs ou click chart avec un outil actif
  </div>
</div>

<script src="/static/validate.js"></script>
</body>
</html>
